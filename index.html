<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon | Spend Less. Smile More 😄</title>
    <link rel="stylesheet" href="style.css"></link>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <nav class="navbar">
        <section class="navbar-menu">
            <div class="menu-logo border">
                <div class="logo"></div>
            </div>
            <div class="menu-delivery border">
                <div class="add-first">Deliver to</div>
                <div class="add-icon">
                    <i class="fa-solid fa-location-dot"></i>
                    <div class="add-sec">Pakistan</div>
                </div>
            </div>
            <div class="menu-search">
                <div class="search-option">
                    <select>
                        <option>All</option>
                        <optgroup label="Electronics">
                            <option>Electric Fan</option>
                            <option>Refrigrator</option>
                            <option>Microwave Oven</option>
                            <option>Electric Kettle</option>
                            <option>Washing Machine</option>
                        </optgroup>
                        <optgroup label="Fashion">
                            <option>Men's Clothing</option>
                            <option>Women's Clothing</option>
                            <option>Shoes</option>
                            <option>Watches</option>
                            <option>Bags</option>
                        </optgroup>
                        <optgroup label="Books">
                            <option>Fiction</option>
                            <option>Non-Fiction</option>
                            <option>Children</option>
                            <option>Text Book</option>
                            <option>Comics</option>
                        </optgroup>
                        <optgroup label="Home">
                            <option>Furtinure</option>
                            <option>Appliances</option>
                            <option>Decor</option>
                            <option>Bedding</option>
                            <option>Cook Ware</option>
                        </optgroup>
                    </select>
                </div>
                <div class="search-bar"><input type="text" placeholder="Search"></div>
                <div class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
            </div>
            <div class="menu-lang border">
                <div class="lang-flag"><div class="flag"></div></div>
                <div class="lang-text"><select><option>ENG</option></select></div>
            </div>
            <div class="menu-signin border">
                <div class="signin-first"><span>Hello, Sign in</span></div>
                <div class="signin-sec"><span>Account & list</span></div>
            </div>
            <div class="menu-return border">
                <div class="return-first"><span>Returns</span></div>
                <div class="return-sec"><span>&Orders</span></div>
            </div>
            <div class="menu-order border">
                <div class="order-cart"><i class="fa-solid fa-cart-shopping"></i></div>
                <div class="order-text"><span>Cart</span></div>
            </div>
        </section>
        <section class="navbar-panel">
            <div class="panel-all border">
                <i class="fa-solid fa-bars"></i><span>All</span>
            </div>
            <div class="panel-links">
                <a href="#">Today's Deal</a>
                <a href="#">Prime Video</a>
                <a href="#">Gift Cards</a>
                <a href="#">Sell</a>
                <a href="#">Registry</a>
                <a href="#">Customer Service</a>
            </div>
            <div class="panel-deal border">Shop deals in Electronics</div>
        </section>
    </nav>
</body>
</html>
